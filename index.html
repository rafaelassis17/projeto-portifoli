<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portifólio</title>
  <link rel="stylesheet" href="estilos/style.css">
  <link rel="shortcut icon" href="favicon.svg" type="image/svg">
  <script src="https://kit.fontawesome.com/b09d3d9057.js" crossorigin="anonymous"></script>
  <style>
    /* 
  Variáveis para cores:
  --fundo-principal
  --texto
  --texto-inverso
  --destaque
  --destaque-inverso
  --fundo-card
*/
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --fundo-principal: #f5f5f5;
      --texto: #222222;
      --texto-inverso: #ffffff;
      --destaque: #0077ff;
      --destaque-inverso: #66bbff;
      --fundo-card: #ffffff;
    }

    body {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      line-height: 1.5em;
      background-color: var(--fundo-principal);
      color: var(--texto);
    }

    header {
      background-color: var(--destaque);
      color: var(--texto);
      padding: 10px;
      display: flex;
      justify-content: flex-end;
      align-content: center;
    }

    #menu ul{
      list-style: none;
      display: flex;
      gap: 10px;
    }

    #menu a{
      text-decoration: none;
      color: var(--texto-inverso);
      font-weight: 600;
      padding: 12px 15px;
      border-radius: 5px;
      transition: background-color 0.3s, color 0.3s;
    }
    #menu a:hover{
      background-color: var(--destaque-inverso);
      color: var(--destaque)
    }
  </style>
</head>

<body>
  <header>
    <nav id="menu">
      <ul>
        <li><a href="#"><i class="fa-solid fa-house"></i></a></li>
        <li><a href="#"><i class="fa-solid fa-brain"></i></a></li>
        <li><a href="#"><i class="fa-solid fa-graduation-cap"></i></a></li>
        <li><a href="#"><i class="fa-solid fa-trowel-bricks"></i></a></li>
        <li><a href="#"><i class="fa-solid fa-moon"></i></a></li>
      </ul>

    </nav>
  </header>

  <main>
    <h1>
      Em breve
    </h1>
  </main>

  <footer>

  </footer>
  <script src="scripts/script.js"></script>
</body>

</html>
