<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portifólio</title>
  <link rel="stylesheet" href="estilos/style.css">
  <link rel="shortcut icon" href="favicon.svg" type="image/svg">
  <script src="https://kit.fontawesome.com/b09d3d9057.js" crossorigin="anonymous"></script>
  <style>
    /* 
  Variáveis para cores:
  --fundo-principal
  --texto
  --texto-inverso
  --destaque
  --destaque-inverso
  --fundo-card
*/
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --fundo-principal: #f5f5f5;
      --texto: #222222;
      --texto-inverso: #ffffff;
      --destaque: #0077ff;
      --destaque-inverso: #66bbff;
      --fundo-card: #ffffff;
    }

    body {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      line-height: 1.5em;
      background-color: var(--fundo-principal);
      color: var(--texto);
    }

    header {
      background-color: var(--destaque);
      color: var(--texto);
      padding: 10px;
      display: flex;
      justify-content: flex-end;
      align-content: center;
    }

    #menu ul {
      list-style: none;
      display: flex;
      gap: 10px;
    }

    #menu a {
      text-decoration: none;
      color: var(--texto-inverso);
      font-weight: 600;
      padding: 12px 15px;
      border-radius: 5px;
      transition: background-color 0.3s, color 0.3s;
    }

    #menu a:hover {
      background-color: var(--destaque-inverso);
      color: var(--destaque)
    }

    main{
display: grid;
grid-template-columns: auto 90vw auto;
gap: 20px;
margin-top: 20px;
    }

  .ficha{
    background-color: var(--fundo-card);
    padding: 20px;
    border-radius: 8px;
    grid-column: 2;
  }

  .ficha img.foto{
    width: 200px;
    aspect-ratio: 1/1;
    object-fit: cover;
    overflow: hidden;
    border-radius: 50%;
    border: 5px solid var(--fundo-card);
    outline: 5px solid var(--destaque);
    display: block;
    margin: auto;
    margin-bottom: 20px;
  }
  
  .ficha h1{
    color: var(--destaque);
    margin: 15px 0;
    font-size: 1.5em;
    text-align: center;
  }

  .social{
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.7em;
    gap: 1em;
    margin-top: 20px;
  } 
  
  .social a {
    color: var(--destaque);
    transition: color 0.3s;
  }
  .social a:hover {
     color: var(--destaque-inverso);
  }
  </style>

 
</head>

<body>
  <header>
    <nav id="menu">
      <ul>
        <li><a href="#"><i class="fa-solid fa-house"></i></a></li>
        <li><a href="#"><i class="fa-solid fa-brain"></i></a></li>
        <li><a href="#"><i class="fa-solid fa-graduation-cap"></i></a></li>
        <li><a href="#"><i class="fa-solid fa-trowel-bricks"></i></a></li>
        <li><a href="#"><i class="fa-solid fa-moon"></i></a></li>
      </ul>

    </nav>
  </header>

  <main>
    <section class="ficha">
      <img src="imagens/akane=perfil.jpg" alt="akane" class="foto">
      <h1>Akane</h1>
      <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorum expedita eveniet quo dolore quibusdam, minus,
        deleniti, quas modi ipsam nemo ratione. Dicta ratione animi voluptates, veritatis repellendus harum soluta!
        Aliquam.</p>
      <div class="social">
        <a href="#" target="_blank" rel="nofollow"><i class="fa-brands fa-linkedin"></i></a>
        <a href="#" target="_blank" rel="nofollow"><i class="fa-brands fa-square-github"></i></a>
        <a href="#" target="_blank" rel="nofollow"><i class="fa-brands fa-youtube"></i></a>
        <a href="#" target="_blank" rel="nofollow"><i class="fa-brands fa-square-instagram"></i></a>
        <a href="#" target="_blank" rel="nofollow"><i class="fa-solid fa-globe"></i></a>
      </div>
    </section>

    <section class="detalhes">

    </section>
  </main>

  <footer>

  </footer>
  <script src="scripts/script.js"></script>
</body>

</html>
